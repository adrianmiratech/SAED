<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAED - Portal del Estudiante</title>
  <link rel="icon" type="image/png" href="img/sams-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="main-area" style="margin-left:0; max-width:920px; margin-inline:auto;">
      <div class="page-header">
        <div class="page-header-title" style="display:flex; align-items:center; gap:12px;">
          <div>
            <h1 id="page-title">Portal del Estudiante</h1>
            <p id="page-subtitle">Tus cursos, materiales y evaluaciones de la Academia.</p>
          </div>
        </div>
        <div class="top-actions">
          <span class="top-divider"></span>
          <div class="user-chip">
            <span class="user-chip-avatar" id="whoami-avatar"></span>
            <span class="user-chip-info">
              <span class="user-chip-name" id="whoami"></span>
              <span class="user-chip-scope" id="whoami-scope"></span>
            </span>
          </div>
          <button id="logout-btn" class="btn-logout btn-sm">Cerrar sesión</button>
        </div>
      </div>

      <div class="content">
        <div class="card">
          <div class="modal-header-badges" style="margin-bottom:10px;">
            <span id="student-department"></span>
            <span id="student-status"></span>
          </div>
          <p class="subtitle" id="student-since" style="margin:0;"></p>
        </div>

        <div class="card">
          <h3 class="modal-section-title" style="margin-top:0; padding-top:0; border-top:none;">Cursos y materiales</h3>
          <div id="student-courses-list" class="staff-list"></div>
          <div id="student-courses-empty" class="empty-state" style="display:none">
            <div class="empty-icon">📚</div>
            <p>Todavía no hay cursos disponibles para tu departamento.</p>
          </div>
        </div>

        <div class="card">
          <h3 class="modal-section-title" style="margin-top:0; padding-top:0; border-top:none;">Mis evaluaciones</h3>
          <div id="student-evaluations-list" class="staff-list"></div>
          <div id="student-evaluations-empty" class="empty-state" style="display:none">
            <div class="empty-icon">📝</div>
            <p>Todavía no tenés evaluaciones registradas.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/student.js"></script>
</body>
</html>

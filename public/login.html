<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login staff SAED</title>
  <link rel="icon" type="image/png" href="img/sams-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <span class="brand-mark">✚</span>
      <span class="brand-text">
        <span class="name">SAED</span>
        <span class="tagline">San Andreas Emergency Departments</span>
      </span>
    </div>

    <div class="card login-card">
      <h1>Panel de Staff</h1>
      <p class="subtitle">Ingresá con tu cuenta para gestionar las postulaciones de SAMS y SAFD.</p>

      <form id="login-form">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autofocus autocomplete="username" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <div class="submit-row">
          <button type="submit" class="btn-primary" id="login-submit">Ingresar</button>
        </div>

        <div id="message" class="message"></div>
      </form>
    </div>

    <a href="/" class="muted-link login-back">← Volver al sitio</a>
  </div>

  <script src="js/login.js"></script>
</body>
</html>

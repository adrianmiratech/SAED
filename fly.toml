app = "saed-6uselq"
primary_region = "ams" # Amsterdam: región donde ya existe el volumen persistente "sams_data"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/data.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "sams_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# app = "sams-postulaciones"   # descomenta y poné el nombre que elijas (debe ser único en Fly.io)
primary_region = "eze" # Buenos Aires. Alternativas: "gru" (São Paulo), "mia" (Miami)

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/data.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "sams_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
